<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootsrtap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Images -->
    <link rel="icon" href="img/rpsLogo.png" type="image/png">
    <!-- Title Page -->
    <title>Rock Paper Scissors</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Jersey 25 Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg allign-items-center">
        <a href="#">
            <h1>Rock Paper Scissors</h1>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main"> 
        <div class="game-container d-flex flex-column align-items-center justify-content-center vh-100">
        <h2 class="round-title text-center mb-5">Round 1</h2>

        <div class="content-wrapper d-flex justify-content-center align-items-stretch w-100">

            <div class="player-section d-flex flex-column align-items-center me-4">
                <h3 class="score-label text-center">YOUR SCORE</h3>
                <div class="score-circles mb-4">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
                <div class="choices d-flex gap-4 mb-3">
                    <div class="choice-icon"><i class="fa-solid fa-hand-fist"></i></div>
                    <div class="choice-icon"><i class="fa-solid fa-hand"></i></div>
                    <div class="choice-icon"><i class="fa-solid fa-hand-peace"></i></div>
                </div>
                <p class="pick-text">Pick one</p>
            </div>

            <div class="vertical-divider mx-5"></div>

            <div class="opponent-section d-flex flex-column align-items-center ms-4">
                <h3 class="score-label text-center">OPPONENT'S SCORE</h3>
                <div class="score-circles mb-4">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
                <p class="opponent-ready">Opponent Ready!</p>
            </div>

        </div>
    </div>
    </main>
    

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-img">
            <!-- A reference to the whole code for this project! -->
            <a href="https://github.com/ZoeCarmona/JavaScript-Practice/tree/simpleProjects/rockPaperScissors">
                <img class="githubLogo" src="img/githubLogo.png" alt="GitHub Logo">
            </a>
        </div>
        <div class="footer-text">
            <p>&copy; 2025 Zoe Carmona</p>
        </div>
    </footer>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    
    <script src="game.js"></script>
</body>
</html>
